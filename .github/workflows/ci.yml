name: CI

on:
  push:
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Rendered fight screen tests
        run: npm run test:screen
      - name: Expo config validation
        run: npm run expo:check
      - name: Expo Doctor
        run: npm run expo:doctor
      - name: Expo web export
        run: npm run build
